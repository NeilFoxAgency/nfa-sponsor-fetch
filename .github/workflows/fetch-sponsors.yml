name: Fetch sponsor decision-maker contacts

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: "Batch directory under batches/ containing targets.json"
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('worker/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r worker/requirements.txt
          python -m playwright install chromium --with-deps

      - name: Extract decision-maker contacts
        env:
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
        run: |
          python worker/fetch_contacts.py \
            --targets "batches/${{ inputs.batch_id }}/targets.json" \
            --out "batches/${{ inputs.batch_id }}/results.json"

      - name: Commit results
        # 2026-10-01: always run, even when the Extract step is killed by the
        # job timeout. The worker flushes results.json after every domain, so
        # a timed-out run still commits partial results instead of yielding
        # zero (the 2026-10-01 timeout-cancellation epidemic).
        if: always()
        run: |
          git config user.name "nfa-fetch-bot"
          git config user.email "nfa-fetch-bot@users.noreply.github.com"
          git add "batches/${{ inputs.batch_id }}/results.json" 2>/dev/null \
            || echo "no results.json to commit"
          git commit -m "results for batch ${{ inputs.batch_id }}" || echo "nothing to commit"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              echo "results committed on attempt $attempt"
              break
            fi
            echo "push attempt $attempt failed; retrying after pull --rebase"
            sleep 5
          done
