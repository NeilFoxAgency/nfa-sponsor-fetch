name: Fetch business contact emails

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: "Batch directory under batches/ containing targets.json"
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r worker/requirements.txt
          python -m playwright install chromium --with-deps

      - name: Fetch contact emails
        run: |
          python worker/fetch_contacts.py \
            --targets "batches/${{ inputs.batch_id }}/targets.json" \
            --out "batches/${{ inputs.batch_id }}/results.json"

      - name: Commit results
        run: |
          git config user.name "sfn-fetch-bot"
          git config user.email "sfn-fetch-bot@users.noreply.github.com"
          git add "batches/${{ inputs.batch_id }}/results.json"
          git commit -m "results for batch ${{ inputs.batch_id }}" || echo "nothing to commit"
          git push
